name: PEA Web checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: pea-web-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Public source boundary and links
        run: |
          python3 tools/check_repository.py
          python3 browser/server/check_source.py
      - name: Browser conformance
        run: node --test browser/tests/*.test.mjs
      - name: Browser-level reviews (headless Chrome, synthetic model, real gateway)
        env:
          PEA_DOM_REQUIRED: "1"
        run: node --test --test-concurrency=4 browser/tests/dom/*.test.mjs
      - name: Synthetic gateway and release checks
        run: python3 -m unittest discover -s browser/server -p 'test_*.py' -v
      - name: Gateway conformance (black box, synthetic model server)
        run: python3 browser/server/conformance/run.py
  mac:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build the Swift gateway
        run: swift build --package-path mac
      - name: Swift unit tests
        run: swift test --package-path mac
      - name: Assemble the unsigned app and check what is inside it
        run: |
          mac/build.sh
          test -x mac/build/PEA.app/Contents/MacOS/PEA
          test -f mac/build/PEA.app/Contents/Resources/browser/server/contract.json
          test ! -e mac/build/PEA.app/Contents/Resources/browser/server/gateway.py
          plutil -lint mac/build/PEA.app/Contents/Info.plist
      - name: Gateway conformance against the Swift gateway (same suite as Python)
        run: |
          PEA_GATEWAY_COMMAND="[\"$PWD/mac/.build/debug/pea-gateway\"]" python3 browser/server/conformance/run.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Browser-level tests served by the Swift gateway (headless Chrome, synthetic model)
        env:
          PEA_DOM_REQUIRED: "1"
          PEA_GATEWAY: swift
        run: node --test --test-concurrency=4 browser/tests/dom/*.test.mjs
