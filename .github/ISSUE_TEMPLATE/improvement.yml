name: Suggest an improvement
description: A focused idea or reusable in-app PR brief.
body:
  - type: markdown
    attributes:
      value: Do not include keys, personal chats, account data, raw diagnostics or private host addresses. Nothing is attached automatically.
  - type: textarea
    id: outcome
    attributes:
      label: What should improve?
      description: Explain the expected outcome and acceptance criteria with synthetic examples.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Public version and commit
      description: Copy only the public build identity from the footer.
